<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade de formulário</title>
</head>

<body>

    <body>

        <style>
            h1 {
                font-size: 17px;
                text-align: center;
            }

            table {
                border-collapse: collapse;
                width: 500px;
                text-align: center;
            }

            th,
            td {
                border: 1px solid #000;
                height: 30px;
                width: 20%;
            }

            form {
                display: flex;
                flex-direction: column;
                height: 300px;
                width: 60%;
                border: #000 1px solid;
                border-radius: 10px;
                gap: 15px;
                padding: 10px;
                background-color: rgb(227, 236, 245);
            }

            label {
                font-size: 15px;
                font-weight: bold;
            }

            input {
                height: 25px;
                border: 1px solid #000;
                border-radius: 5px;
                font-size: 12px;
                padding-left: 5px;
            }

            .secao {
                display: flex;
                flex-direction: row;
            }

            .meios {
                display: flex;
                flex-direction: column;
                width: 100%;
                padding: 5px;

            }

            .opcoes {
                display: flex;
                align-items: center;
            }

            p {
                margin-right: 15px;
                font-size: 12px;
            }

            .envio {
                display: flex;
                flex-direction: column;
                padding-left: 5px;
            }

            .confirmacao {
                display: flex;
                align-items: center;
            }

            button {
                width: 150px;
                height: 30px;
                font-size: 12px;
                border: 1px solid #000000;
                border-radius: 5px;
                background-color: rgb(42, 42, 137);
                color: aliceblue;
            }
        </style>


        <form onsubmit="event.preventDefault(); addLinha()";

            nomeTabela.textContent = nome.value
            emailTabela.textContent = email.value
            interesseTabela.textContent = interesse.value
            turnoTabela.textContent = turno.value
            situacaoTabela.textContent = situacao.value
        
        >

            <h1>Cadastro de participante</h1>


            <div class="secao">
                <div class="meios">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Nome do aluno">
                </div>

                <div class="meios">
                    <label for="email">E-mail</label>
                    <input type="text" id="email" placeholder="aluno@email.com">
                </div>

            </div>

            <div class="secao">
                <div class="meios">
                    <label for="interesse">Área de interesse: </label>
                    <input type="text" id="interesse" placeholder="Front-end v">
                </div>

                <div class="meios">
                    <label for="">Turno</label>
                    <div class="opcoes">
                        <input type="radio" name="escolha" id="turno" value="Manhã">
                        <p>Manhã</p>
                        <input type="radio" name="escolha" id="turno" value="Tarde">
                        <p>Tarde</p>
                        <input type="radio" name="escolha" id="turno" value="Noite">
                        <p>Noite</p>
                    </div>
                </div>
            </div>

            <div class="envio">
                <div class="confirmacao">
                    <input type="radio" id="situacao" value="Ativo">
                    <p>Confirmo os dados informados</p>
                </div>

                <button>Adicionar à tabela</button>
            </div>


        </form>

        <br />

        <table  id="tabela">
            <thead>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Área</th>
                <th>Turno</th>
                <th>Situação</th>

            </thead>
            <tbody id="corpo">
                <!-- <td id="nomeTabela"></td>
                <td id="emailTabela"></td>
                <td id="interesseTabela"></td>
                <td id="turnoTabela"></td>
                <td id="situacaoTabela"></td> -->
            </tbody>
        </table>

        <br>
        <hr><br>

        <script>

            function addLinha() {
                var newRow = document.getElementById('tabela').insertRow();

                let newCell = newRow.insertCell();
                newCell.textContent = document.getElementById("nome").value;

                newCell = newRow.insertCell();
                newCell.textContent = document.getElementById("email").value;

                newCell = newRow.insertCell();
                newCell.textContent = document.getElementById("interesse").value;

                newCell = newRow.insertCell();
                newCell.textContent = document.getElementById("turno").value;

                newCell = newRow.insertCell();
                newCell.textContent = document.getElementById("situacao").value;
            }

        </script>

    </body>

</body>

</html>
